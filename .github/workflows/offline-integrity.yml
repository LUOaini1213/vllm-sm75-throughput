name: Offline client integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install aiohttp==3.14.3
      - run: python -B -m unittest discover -s tests -v
      - run: python -O -B -m unittest discover -s tests -v
      - run: python -B verify_historical.py
      - run: python -O -B verify_historical.py
