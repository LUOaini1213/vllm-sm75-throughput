name: CI

# 这仓的测量全在 Colab T4 上做，GPU 那部分进不了 CI。
# 能进 CI 的是另一半：把结果文件与 notebook 输出解析回来，
# 逐个回算 README 里的数字。下面每一步都是纯标准库，不装任何依赖。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 编译全部 .py
        run: python -m compileall -q .

      - name: notebook 静态检查（六条规则，量仓内全部 notebook）
        run: python tools_check_notebooks.py

      - name: 回算 README 里的每个数字
        run: python check_claims.py

      - name: 2026-09-18 补充练习：从原始证据重建 summary.json / RESULTS.md 并逐字节比对
        run: python streaming_accounting_20260918/analyze_results.py --check

      - name: 受版本控制的文本里不得出现本机用户目录路径
        run: |
          if git grep -n -I -E '/mnt/[a-z]/Users/[A-Za-z]|[A-Za-z]:[\/]Users[\/][A-Za-z]|/home/[a-z][a-z0-9_-]*/' -- . ; then
            echo "::error::local machine path in a tracked file (see lines above)"
            exit 1
          fi
